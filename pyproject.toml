[project]
name = "ai-stock-trader"
version = "0.1.0"
description = "AI-assisted equity research: price projections, portfolio and dividend analytics, news signals, and paper trading."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
